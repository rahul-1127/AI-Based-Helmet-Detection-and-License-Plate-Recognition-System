<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helmet Detection AI</title>
    <link rel="stylesheet" href="stylehel.css">
</head>
<body>

<header>
    <h1>🛵 Helmet Detection System</h1>
    <p>Real-Time AI Surveillance Monitoring</p>
</header>

<div class="container">

    <div class="card">
        <h2>Live Camera Feed</h2>
        <video id="video" autoplay playsinline></video>
        <button id="startBtn">Start Camera</button>
    </div>

    <div class="card">
        <h2>Detection Result</h2>
        <div id="status" class="status safe">
            Helmet Detected ✔
        </div>
        <button id="simulateBtn">Simulate Detection</button>
    </div>

</div>

<footer>
    <p>© 2026 Helmet Detection AI | Designed by Sai Gopi Krishna</p>
</footer>

<script src="script.js"></script>
</body>
</html>
